# PUNISHES naive momentum: a long leadership run, then a violent reversal in
# which yesterday's winners become the worst names. Rewards reversal, low-vol
# and vol-dialing instead.
# MIRROR: xs_bull_dispersion (same pool, alpha persistence instead of reversal).
# Provenance: reversal magnitude ~ -3.5%/bar over 40 bars is the 2009-03 and
# 2020-04 momentum-crash scale; LAGG's +0.0030 is the mirror-image junk rally.
name: xs_momentum_crash
source: factor
symbols: [HIB1, HIB2, MID1, MID2, LOB1, LOB2, LAGG, HAVEN]
seed: 104
regimes:
  - {periods: 250, drift: 0.0006, volatility: 0.010}
  - {periods: 40,  drift: -0.0010, volatility: 0.022}
  - {periods: 210, drift: 0.0008, volatility: 0.012}
factor_symbols:
  HIB1:  {beta: 1.4,  alpha: [0.00100, -0.00350, 0.00020],  idio_vol: 0.010}   # high-beta growth
  HIB2:  {beta: 1.3,  alpha: [0.00090, -0.00320, 0.00015],  idio_vol: 0.010}
  MID1:  {beta: 1.0,  alpha: 0.0,      idio_vol: 0.008}   # market-like
  MID2:  {beta: 1.0,  alpha: 0.0,      idio_vol: 0.008}
  LOB1:  {beta: 0.7,  alpha: 0.00005,  idio_vol: 0.006}   # defensive
  LOB2:  {beta: 0.6,  alpha: 0.0,      idio_vol: 0.006}
  LAGG:  {beta: 1.1,  alpha: [-0.00090, 0.00300, -0.00060], idio_vol: 0.010}   # rejecting it must pay
  HAVEN: {beta: -0.20, alpha: 0.00006, idio_vol: 0.005}   # costs to hold
initial_cash: 10000
slippage_bps: 1.0
risk: {max_position_pct: 0.6, max_gross_exposure: 1.0, max_daily_loss_pct: 1.0}
