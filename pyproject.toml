[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "A lean, modular, paper-trading-first stock/ETF trading bot built on Alpaca."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "erancihan" }]
keywords = ["trading", "algorithmic-trading", "backtesting", "alpaca", "paper-trading", "finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/erancihan/tradebot"
Repository = "https://github.com/erancihan/tradebot"
Issues = "https://github.com/erancihan/tradebot/issues"
Changelog = "https://github.com/erancihan/tradebot/blob/master/CHANGELOG.md"

# Live/paper trading against the broker needs the Alpaca SDK + dotenv.
# The strategy/backtest core works without these, so they are optional.
[project.optional-dependencies]
live = [
    "alpaca-py>=0.21",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=7.4",
    "httpx>=0.24",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
tradebot = "tradebot.cli:main"
tradebot-web = "tradebot.web.server:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
