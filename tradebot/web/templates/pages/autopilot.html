{% extends "base.html" %}
{% block title %}Autopilot · tradebot{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl space-y-4" x-data="autopilot" @click="onClick($event)">
  <h1 class="text-lg font-semibold text-slate-100">Autopilot</h1>

  <div x-show="error" x-cloak
       class="rounded-lg border border-rose-800 bg-rose-950/40 p-3 text-sm text-rose-300 break-words"
       x-text="error"></div>

  <div x-ref="panel" class="space-y-4" :class="busy && 'opacity-60'">
    {% include "components/autopilot_panel.html" %}
  </div>

  <div class="space-y-2 rounded-lg border border-slate-800 bg-slate-900/40 p-3" data-test-alert>
    <button type="button" @click.stop="testAlert()"
            class="min-h-[48px] w-full rounded-lg border border-slate-700 bg-slate-900 text-base font-semibold text-slate-200 hover:bg-slate-800">
      Send test alert
    </button>
    <p class="text-xs text-slate-400" x-show="alert" x-cloak x-text="alert"></p>
  </div>

  <p class="text-xs text-slate-500">Paper account only. Live trading stays behind the
    config file and the confirmation latch; this page cannot reach it.</p>
</section>
{% endblock %}
