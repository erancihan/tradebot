# tradebot configuration. Copy to `config.yaml` and tweak.
# Secrets (API keys) do NOT go here — they live in `.env` / the environment.

# Trading mode: backtest | paper | live
#   paper  -> simulated fills on Alpaca's paper account (safe, default)
#   live   -> REAL money; also requires TRADEBOT_LIVE_CONFIRM=I_UNDERSTAND
#
# Tip: add `--dry-run` (or `--replay` for fully offline) to `tradebot run` to
# forward-test this exact config against a virtual account — no orders are sent,
# regardless of the mode below. e.g. `tradebot run --config config.yaml --replay`
mode: paper

# Symbols to trade. Liquid ETFs are a sane place to start.
# (If a `universe:` block is set below, this list is replaced at startup by
# the screened candidates — replay/offline runs keep using this list. A
# non-empty Today watchlist replaces both, for the web and `tradebot run`.)
symbols:
  - SPY
  - QQQ

# --- Universe (optional) --------------------------------------------------------
# Discover the candidate pool from Alpaca instead of hand-typing `symbols`:
# shortlist today's most-active names, keep active+tradable ones, then screen
# by minimum price and rolling average dollar volume (ADV). Resolved once at
# startup, printed, and snapshotted to SQLite (point-in-time paper trail).
# Preview with: tradebot universe --config config.yaml   (needs free creds)
#
# NOTE: free IEX data reports ~2% of consolidated volume, so ADV floors are
# conservative by construction. A universe screened today is survivorship-
# biased for historical backtests — use it live-forward.
#
# universe:
#   source: alpaca_liquidity
#   params:
#     candidates: 100           # most-actives shortlist size
#     min_price: 5.0            # skip penny-stock pathologies
#     min_dollar_volume: 1000000  # rolling ADV floor (IEX volume!)
#     window: 20                # ADV window in trading days
#     max_symbols: 20           # keep the top-N most liquid survivors
#     # fractionable_only: true # require fractional-order support

# Bar size: 1min | 5min | 15min | 1hour | 1day
timeframe: 1day

# How often `tradebot run` and the autopilot make a pass, in seconds (300 =
# every 5 min; at least 10). Approve-first links live, and an unchanged batch
# is pushed again, every 2 x this (at least 30 minutes).
poll_seconds: 300

# Exchange calendar the autopilot (and its morning brief) schedule against:
#   us_equities (default) | bist (Borsa Istanbul, 10:00-18:00 Istanbul time)
# Only Alpaca (US equities) can trade today, so `bist` changes WHEN the loop
# wakes, never where orders go. Unknown names are rejected at load.
market: us_equities

# --- Autopilot (optional) -------------------------------------------------------
# Morning brief: N minutes before each open the autopilot sends the day's
# proposal as a short list (BUY 3 SPY (reason)) through the notifier. A preview
# only: nothing is stored or submitted. Runs in every autopilot mode, including
# `tradebot run --autopilot --mode off` (brief only). Omit to disable.
# autopilot:
#   brief_minutes_before_open: 30

# The list is the mandate: a held stock not on the list (watchlist, else
# `symbols`) gets a sell-to-flat line. false leaves such holdings alone. Live
# mode never sells a name off the list, whatever this says.
# manage_unlisted: true

# Starting capital for backtests, dry-runs and the offline (no-keys) account;
# paper/live with keys read equity from the broker.
initial_cash: 10000

# Backtest cost assumptions.
commission: 0.0       # Alpaca US equities are commission-free
slippage_bps: 1.0     # 1 bp = 0.01% slippage per fill

# Where `tradebot` commands keep the SQLite log (orders, equity snapshots, the
# watchlist `tradebot run` trades). `tradebot-web` uses this file too, unless
# --trading-db (or TRADEBOT_DB) names another.
db_path: tradebot.db

# --- Strategy -----------------------------------------------------------------
# Available: sma_crossover, rsi_reversion, buy_and_hold, donchian_breakout,
#            macd_trend, bollinger_reversion, momentum, supertrend,
#            follow_leader, ensemble_vote
# (the meta strategies take `strategies: [{name, params}, ...]` to pick their
#  roster; defaults to a mixed trend/mean-reversion four)
strategy:
  name: sma_crossover
  params:
    fast: 20
    slow: 50
    use_ema: false
    allow_short: false

# Example RSI config (swap `name` above to use it):
# strategy:
#   name: rsi_reversion
#   params:
#     period: 14
#     oversold: 30
#     overbought: 70
#     exit_level: 50
#     allow_short: false

# --- Portfolio: selection + allocation ------------------------------------------
# Optional: turn the symbol list into a managed portfolio. Omit this block
# entirely to keep the legacy sizing (every symbol gets the fixed
# `max_position_pct` slug below).
#
#   selector    decides WHICH symbols may be held (cross-sectional gate);
#               `momentum` ranks by trailing (lookback-skip) return, holds the
#               top_k, and only drops a holding once it slips below exit_rank
#               (hysteresis, default 1.5*top_k) to cut churn. Set reverse: true
#               for short-term reversal (hold the losers; use a short lookback).
#               `low_vol` holds the top_k *calmest* names (rolling stdev window).
#   allocation  decides HOW MUCH each held symbol gets. Weights always pass
#               through the risk caps and the whole book is sized jointly
#               (order-independent).
#
# Tip: `strategy: {name: buy_and_hold}` makes the selector the sole signal —
# the classic momentum top-K portfolio. Any other strategy acts as an
# additional per-symbol gate on top of membership.
#
# portfolio:
#   selector:
#     name: momentum
#     params: {lookback: 252, skip: 21, top_k: 5}    # 12-1 momentum, hold 5
#   allocation: inverse_vol   # equal | inverse_vol | explicit
#   params:
#     window: 63              # inverse_vol: rolling stdev window (daily bars)
#     # gross_target: 1.0     # equal/inverse_vol: total fraction to deploy
#     # weights: {SPY: 0.6, QQQ: 0.4}   # explicit only
#   overlays:                 # optional risk transforms on the weights, in order
#     # cap any one sector's total weight (unmapped symbols share one
#     # conservative "other" bucket); sectors_file: CSV of symbol,sector rows
#     - name: sector_cap
#       params: {max_sector_pct: 0.5, sectors: {AAPL: tech, MSFT: tech}}
#     # scale the whole book down when its realized vol runs above target
#     # (never levers up); keep this one last so it measures the final book
#     - name: vol_target
#       params: {target_vol: 0.15, window: 20}

# --- Risk management ----------------------------------------------------------
risk:
  max_position_pct: 0.10      # at most 10% of equity per symbol
  max_gross_exposure: 1.0     # at most 100% of equity deployed across all symbols
  max_daily_loss_pct: 0.03    # flatten + halt after a 3% daily drawdown
  allow_fractional: false     # whole shares only
  rebalance_band_pct: 0.01    # skip drift trades smaller than 1% of equity
                              # (full exits and long/short flips always execute). The default when
                              # unset; 0 disables the band.
  # Bracket exits attached to entries, as fractions of the entry price. Both are
  # optional; either can be set alone. PAPER/LIVE (and dry-run) ONLY — the
  # backtester does not model them, so a backtest will not show their effect. A bracket protects
  # BETWEEN rebalance passes: if the signal is still long after a stop fires,
  # the next pass re-enters. Each must be above 0 and below 1.
  # stop_loss_pct: 0.05       # exit 5% below the entry price
  # take_profit_pct: 0.15     # exit 15% above it

# --- Notifications ------------------------------------------------------------
# Order fills, bracket exits, daily-loss halts, approval batches and the morning
# brief always go to the log. Set a webhook to also POST them as JSON (stdlib
# urllib; no new dependency). Delivery failures are logged and swallowed — an
# unreachable endpoint never halts trading.
# notify:
#   webhook_url: https://hooks.example.com/tradebot
#   ntfy_topic: tradebot-pick-a-long-random-name   # phone alerts via the ntfy app
#   ntfy_server: https://ntfy.sh                   # optional; default shown
#   # The address your phone opens the app at (http or https, a host, no query).
#   # When set, the push for a pending batch (autopilot "approve" mode) carries
#   # Approve all / Skip / Open buttons. Approve and Skip POST short-lived signed
#   # links for that one batch; the server must be reachable from the phone
#   # (README "Reach it over the network"). Not a secret itself, BUT with it set
#   # the ntfy topic grants approval of the bot's own pending paper trades: use a
#   # self-hosted ntfy or ntfy access control, and a long random topic. Each
#   # link works once per server process; only the paper account's push carries
#   # Approve and Skip (dry-run and live pushes get just Open).
#   public_url: http://192.168.1.20:8000
